# The co-signer does not share the application's user account.
#
# 10-hardening.conf puts every unit under User=letterlock. That is right for the
# units that are one application; it is wrong here, because the whole point of
# this service is that the half of the system holding the ciphertext and the
# half holding the outer key are not the same principal. Sharing an account
# means a bug in the web UI or the mail daemon reads the credentials directory
# of this unit and the split is decorative.
#
# Numbered above the sandbox drop-in so these settings win. systemd applies
# drop-ins in lexical order and a later User= replaces an earlier one; the rest
# of the hardening (NoNewPrivileges, ProtectSystem=strict, the lot) is inherited
# untouched, which is the reason this is an override rather than a second copy
# of the sandbox.
#
# Until phase 4 this is still one machine, so it is separation of privilege, not
# separation of operator. It stops the app from reading these keys. It does not
# stop root, and no claim in the product copy may say otherwise before the
# enclave actually moves to Phala. See docs/plan_token_custody.md §1.

[Service]
User=cosigner
Group=cosigner

# Read access to /opt/letterlock (the source and the venv) comes from the group,
# not from ownership: the app directory is 750 letterlock:letterlock. The paths
# that hold user data inside it -- database/, state/, config/, .env -- are 700
# and 600, so group membership does not reach them. This unit can import the
# code it runs and read nothing else the application owns.
SupplementaryGroups=letterlock

# The operator alert in alerts.py is the one thing this unit needs a secret for,
# and it had none: not being in letterlock-secrets it cannot read .env, so
# TELEGRAM_BOT_TOKEN was unset, telegram.operator_target() answered None and
# every refused unwrap and every co-signer outage alerted nobody. It was one
# stderr line in the journal, which is precisely the "nobody is looking" this
# service exists to avoid.
#
# EnvironmentFile= rather than the secrets group, because systemd reads it as
# root before dropping to User=cosigner: the unit gets these two values and
# still cannot open the file, let alone .env. A separate file and not .env for
# the same reason .env.billing is separate -- that one holds SESSION_SECRET,
# the inference keys and the Google client secret, and the process holding the
# outer wrapping key is the last one that should also hold those.
#
# Leading `-` so a box that has not been given the file still starts. An alert
# path that fails is bad; a co-signer that refuses to boot stops all mail.
EnvironmentFile=-/opt/letterlock/.env.alerts

# Drops /opt/letterlock from the writable set the sandbox grants the other
# units. Everything this service writes is the audit log, and that lives in
# StateDirectory=cosigner, which systemd keeps writable regardless.
ReadWritePaths=

# The sandbox's egress settings are inherited unchanged, deliberately, and this
# is the one place worth saying why -- because it looks like a missed
# opportunity to narrow.
#
# This service dials two things: Telegram, for the operator alert in alerts.py,
# and the PCCS in cosigner/allowlist.json when it verifies an inbound RA-TLS
# certificate. Both are in the shared allowlist, so a tighter list for this unit
# would be a real narrowing. It is not available: there is one proxy, it does
# not authenticate its clients, and a per-unit list needs either per-unit
# credentials or a second listener. Neither is worth its complexity for a
# subset this small.
#
# What the unit does get is the same IPAddressDeny=any as everything else, which
# means a compromised co-signer reaches the internet only by asking the proxy,
# by name, with a line in the journal for each attempt. Narrowing further is a
# follow-up and not a hole: see docs/plan_security_hardening.md Track E3.
