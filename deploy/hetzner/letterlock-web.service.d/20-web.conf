# The web UI does not share the mail units' user account.
#
# 10-hardening.conf puts every unit under User=letterlock. That was right while
# "the application" was one thing. It is wrong for this unit, because this is the
# process parsing HTTP from the open internet, and under one uid a parsing bug
# here read every account's database/<id>/ and could ask the co-signer to unwrap
# any of them. Compromise of this service was compromise of every mailbox.
#
# What the split is worth depends entirely on what this account cannot reach:
#
#   * token.bin is written by the mail uid at 0600, so this unit cannot read a
#     wrapped refresh token. It still obtains an account's data key from the
#     co-signer to render the two documents, and that key would open a token --
#     the mode is what makes the ciphertext unavailable to open.
#   * The OAuth code exchange runs in the daemon over the socket in
#     backend/custody/handoff.py, so a plaintext refresh token never exists in
#     this process, not even for the moments after a consent.
#   * .gmail-mcp/ stays 0700 to the mail uid. The client secret lives there, and
#     this unit receives the authorization code on the redirect; holding both
#     plus the PKCE verifier (derived from the state it minted) would let it
#     exchange the code itself and undo the line above. Building the consent URL
#     therefore also goes over the socket.
#
# What it still reaches, stated so nobody reads more into this than it does:
# database/accounts.json is writable here, so this unit can still repoint an
# account's telegram target and have the summary delivered elsewhere. Closing
# that means the manifest stops being a file this unit can write, which is a
# separate change.

[Unit]
# Ordering, not a requirement, for the same reason the sandbox orders every unit
# after the egress proxy: sign-in needs the daemon's socket, but a web UI that
# refused to start without it would take the whole site down for a daemon
# restart. Every page that does not sign in works regardless, and the two that
# do render an outage instead of hanging.
Wants=email-daemon.service
After=email-daemon.service

[Service]
User=letterlock-web
Group=letterlock-web

# letterlock: the source and the venv, which are 750 letterlock:letterlock.
# letterlock-data: database/, state/ and config/, shared with the mail units.
# letterlock-secrets: .env, which is 640 and not the same grant as the account
# store, so the two can be separated later without touching this line's meaning.
#
# cosigner and egress deliberately carry only `letterlock`, which is why the
# account store and .env are not that group: those two units reach the code they
# run and nothing a user owns.
SupplementaryGroups=letterlock letterlock-data letterlock-secrets

# The sandbox grants /opt/letterlock. This unit writes two directories in it and
# nothing else, so the empty assignment resets the inherited list before the
# narrower one replaces it. Notably it cannot write the source it runs.
ReadWritePaths=
ReadWritePaths=/opt/letterlock/database /opt/letterlock/state
