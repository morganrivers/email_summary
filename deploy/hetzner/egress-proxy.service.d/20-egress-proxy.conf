# The proxy is the exception to the sandbox it is part of.
#
# 10-hardening.conf gives every unit IPAddressDeny=any, IPAddressAllow=localhost
# and an https_proxy pointing here. Applied to this unit unchanged that is a
# process which can only reach loopback and which proxies to itself, so all
# four settings are reset below. Numbered above the sandbox drop-in so they win;
# systemd applies drop-ins in lexical order.
#
# Everything reset here is reset deliberately, and each one is the thing that
# makes this unit the enforcement point rather than another unit behind it.

[Unit]
# The sandbox orders every unit after this service. Ordering a unit after
# itself is a cycle systemd would break by dropping an edge of its choosing.
Wants=
After=
After=network-online.target

[Service]
# Its own account, for the same reason the co-signer has one: an RCE in the web
# UI or the mail daemon must not be able to become the process that is allowed
# to talk to the internet.
User=egress
Group=egress

# Read access to the source and the venv comes from the group, not from
# ownership, exactly as it does for the co-signer: /opt/letterlock is 750
# letterlock:letterlock, and database/, state/, config/ and .env inside it are
# 700 and 600. So this unit can import the module it runs and read none of the
# API keys or account data -- which is the arrangement the whole unit exists
# for, since it is the one process that could send them somewhere.
#
# backend/secrets.py's loader treats a .env it may not read as a .env that is
# not there, so importing a module that reaches for a constant through load()
# does not take this unit down for being correctly sandboxed.
SupplementaryGroups=letterlock

# Nothing to write. The allowlist is computed at startup from the source, the
# audit trail is the journal, and there is no state to keep between requests.
ReadWritePaths=

# The whole internet, which is the point. IPAddressDeny= empties the sandbox's
# deny list before IPAddressAllow widens it; assigning the empty string to
# either resets it rather than adding to it.
IPAddressDeny=
IPAddressAllow=any

# No proxy variables. Environment= with no value resets the list, which also
# drops the PATH set in the .service file, so it is set again here. A proxy
# that inherited https_proxy would dial itself for every tunnel it opened.
Environment=
Environment=PATH=/opt/letterlock/venv/bin:/usr/local/bin:/usr/bin:/bin
