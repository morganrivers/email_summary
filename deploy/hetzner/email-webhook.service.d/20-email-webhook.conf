# The Gmail push receiver does not share the mail daemon's user account.
#
# 10-hardening.conf puts every unit under User=letterlock. This is the third
# process on the box that parses HTTP arriving from the open internet, and it
# was the cheapest one to move: it needs no key material at all. It verifies a
# Pub/Sub OIDC JWT, resolves emailAddress to an account through the manifest,
# appends an account id to the wake spool and pokes the FIFO. That is the whole
# program. Under the shared uid a parsing bug in it read every account's
# database/<id>/ and could ask the co-signer to unwrap any of them, for no
# reason this unit's job could ever justify.
#
# What this account cannot reach, which is the whole value:
#
#   * No letterlock-secrets, so .env is unreadable. It needs nothing from it:
#     WEBHOOK_AUD falls back to site.pubsub_audience() and
#     PUBSUB_SERVICE_ACCOUNT to the literal in gmail_hook_server.py, and
#     backend/secrets.py treats a .env it may not read as one that is not
#     there. Confirm before deploying that neither variable is set in .env to
#     something other than those defaults, because a WEBHOOK_AUD that stops
#     being read rejects every genuine push and looks like a Pub/Sub outage.
#   * No access to database/ at all, not even read. It does not resolve the
#     address it receives: it spools the address and the daemon resolves it.
#     Resolving means reading the manifest, which is every user's address and
#     whether they are paid up, and this program verifies a JWT and appends a
#     line. See the docstring of backend/daemons/gmail_hook_server.py.
#
# What is left is a process that can wake the mail daemon for an address, and
# nothing else. It reads no account data and no secret.

[Unit]
# Ordering, not a requirement. state/, the FIFO and the spool are created by the
# daemon; a push arriving before it is up fails soft (signal_daemon logs and
# returns) and Pub/Sub retries. Requires= would take the public endpoint down
# for a daemon restart and turn every push in that window into a 503.
Wants=email-daemon.service
After=email-daemon.service

[Service]
User=letterlock-hook
Group=letterlock-hook

# letterlock: the source and the venv, which are 750 letterlock:letterlock, plus
# the traversal into state/.
# letterlock-wake: the FIFO and the two wake spool files, and nothing else in
# state/. A separate group from letterlock-data because that one holds the web
# uid and the billing uid, and waking the daemon for an account of the caller's
# choosing spends that account's co-signer budget. See backend/paths.py.
#
# Deliberately not letterlock-data and not letterlock-secrets. This unit reads
# no account data and no secret, and the grants it does not have are the point
# of moving it off the shared account.
SupplementaryGroups=letterlock letterlock-wake

# The sandbox grants /opt/letterlock. This unit writes one directory in it.
# The empty assignment resets the inherited list before the narrower one
# replaces it; notably it can write neither the source it runs nor the account
# store it reads.
ReadWritePaths=
ReadWritePaths=/opt/letterlock/state
