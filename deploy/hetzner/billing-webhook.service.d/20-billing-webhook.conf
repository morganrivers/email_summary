# The Polar receiver does not share the mail daemon's user account, and no
# longer writes the account store at all.
#
# 10-hardening.conf puts every unit under User=letterlock. This is the fourth
# process parsing HTTP from the open internet, and it was sharing the uid that
# holds every mailbox in order to flip one field. It now verifies a Standard
# Webhooks signature and appends the event to a spool; backend/daemons/
# daemon_loop.py applies it. See backend/billing/billing_queue.py for why, and
# for what deferring costs.
#
# What this account cannot reach:
#
#   * database/, at all. Writing plan_status meant writing the manifest, and a
#     manifest writer holds every account's plan (activate itself, deactivate
#     everyone else), the Polar customer link, and the ability to corrupt the
#     store outright. Not mail content: the field that reached that, the
#     telegram target, is behind backend/accounts/chat_link.py. That write is
#     now the daemon's, not this unit's.
#   * .env, so neither SESSION_SECRET (which mints login cookies, and would let
#     a compromise here sign in to the web UI as anyone) nor the inference keys
#     nor the Google client secret. It reads .env.billing, which holds the
#     Polar webhook signing secret alone. The Polar API token stays in .env
#     because this unit no longer calls Polar's API.
#   * The wake FIFO and the wake spool. Its spool is its own, under its own
#     group, so it cannot drive mail processing for an account of its choosing.
#
# What is left is a process that can verify a signature and write lines the
# daemon will read. The daemon answers each by asking Polar what is true rather
# than believing the body, so a forged entry buys nothing a valid signature
# would not have bought anyway.

[Service]
User=letterlock-billing
Group=letterlock-billing

# letterlock: the source and the venv, which are 750 letterlock:letterlock, plus
# the traversal into state/.
# letterlock-billing-queue: its own two spool files in state/ and nothing else.
# letterlock-billing-secrets: .env.billing, the one secret it reads.
SupplementaryGroups=letterlock letterlock-billing-queue letterlock-billing-secrets

# The sandbox grants /opt/letterlock. This unit writes two files in state/ and
# nothing else, so the empty assignment resets the inherited list before the
# narrower one replaces it. It cannot write the source it runs, and it can no
# longer write the account store at all.
ReadWritePaths=
ReadWritePaths=/opt/letterlock/state
