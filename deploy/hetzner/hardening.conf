# Canonical sandbox for every Letterlock unit.
#
# deploy.sh installs this file as /etc/systemd/system/<unit>.d/10-hardening.conf
# for each unit it deploys, so these settings live in exactly one place instead
# of being copy-pasted into seven .service files that then drift.
#
# The services used to run as root. Two of them (the web UI and the Gmail push
# webhook) are stdlib HTTP servers reachable from the internet through Caddy, so
# a parsing bug in either was root on the box that holds every user's Gmail
# refresh token. They listen on loopback ports above 1024 and need no privilege.
#
# ReadWritePaths is state/ and database/ and nothing else. It used to be the
# whole app directory, which handed every unit write access to the code every
# other unit runs: rsync leaves the source tree group-writable, every unit
# carries SupplementaryGroups=letterlock to reach it, so the co-signer's account
# could rewrite backend/daemons/daemon_loop.py and wait for a restart. The web
# tier not being able to read token.bin means little while it can edit the code
# of the process that can. Narrowing it here is the control, and the deploy's
# `chmod -R g-w` is the same statement in file modes for anything reaching the
# tree outside a unit.
#
# It is also what makes NoExecPaths below worth setting: with the venv writable
# a dropped .so is an executable page, and ExecPaths has to name the venv.
#
# Both directories must exist or the unit fails to start, which is why the
# deploy creates them rather than leaving it to ensure_run_dir(): that call now
# lands inside the only directory it is allowed to create.
#
# The network half is IPAddressDeny=any plus IPAddressAllow=localhost, with
# every HTTP client pointed at the CONNECT proxy on loopback. Restricting the
# filesystem while saying nothing about where a socket may point left code
# execution in the web UI or the push webhook one POST away from taking
# database/ off the box. The reachable set is now exactly the allowlist in
# backend/egress.py. Read that module and backend/daemons/egress_proxy.py for
# what this covers and what it does not.

[Unit]
# Ordering, not a requirement: a unit that starts before the proxy fails its
# first outbound call and retries, whereas Requires= would take the whole mail
# path down for a proxy restart. The proxy is in this list too and resets both
# lines in its own drop-in, since a unit must not order after itself.
Wants=egress-proxy.service
After=egress-proxy.service

[Service]
User=letterlock
Group=letterlock
UMask=0077

NoNewPrivileges=yes
PrivateTmp=yes
PrivateDevices=yes
ProtectSystem=strict
ProtectHome=yes
ReadWritePaths=/opt/letterlock/state /opt/letterlock/database
ProtectKernelTunables=yes
ProtectKernelLogs=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
RestrictNamespaces=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
LockPersonality=yes
RemoveIPC=yes
PrivateMounts=yes

# The set of processes on this box is closed, and these lines are what close it.
# Nothing in the tree spawns anything: there is not one subprocess, Popen, fork
# or exec call in backend/, frontend/ or cosigner/. So the sandbox can forbid
# what the code never does, and every "drop a binary and run it" payload stops
# being a thing that works rather than a thing we watch for.
#
# Prevention rather than detection is deliberate. A monitor that notices an
# extra process is a monitor an attacker can race, and it cannot report what it
# was killed before seeing.
#
# NoExecPaths=/ makes the whole filesystem non-executable and ExecPaths names
# the two exceptions. /usr covers the interpreter and every shared library
# (Ubuntu is usrmerge, so /bin and /lib resolve there). The venv is separate
# because site-packages maps compiled extensions executable. Nothing else on the
# box can be executed by these units, PrivateTmp's /tmp included -- which is
# where a payload writes, having nowhere else.
#
# A seccomp denial of execve would be the tighter statement and is not available
# here: systemd installs the filter in the forked child and then execs the
# service binary, so the unit would refuse to start.
NoExecPaths=/
ExecPaths=/usr /opt/letterlock/venv
MemoryDenyWriteExecute=yes

# The 32-bit ABI is a second numbering of every syscall, so a filter written
# against the native table says nothing about a process that switches. Cheap,
# and it is the standard way out of a seccomp policy.
SystemCallArchitectures=native

# /proc shows this unit's own processes and nothing else, and the non-process
# files in there are hidden too. Two units run as accounts that share the
# `letterlock` group, so without this each could read the other's command lines
# and environment. It is also the cheapest thing that makes reconnaissance from
# inside a compromised unit fail.
ProtectProc=invisible
ProcSubset=pid

# A ceiling on threads plus processes. Nothing here goes near it: the daemon
# runs the handoff listener on one thread, the co-signer its retention sweep on
# another, and the web UI a thread per request. It is what turns a fork bomb or
# a miner into an immediate failure instead of a graph someone reads later.
# TasksAccounting is on so the ceiling is enforced rather than declared.
TasksAccounting=yes
TasksMax=128

# Loopback and nothing else. Caddy reaches the servers over it, the units reach
# the proxy over it, and every other destination is the proxy's decision rather
# than the kernel's. Needs cgroup v2 with BPF, which this box has; on a kernel
# without it systemd logs that the filter was not installed and the unit still
# starts, so a green deploy is not on its own evidence the control is on --
# `deploy/check_egress.py` is.
#
# This covers ingress as well as egress, which is fine only because nothing
# here is reached directly: every inbound request arrives from Caddy over
# loopback. A unit that ever binds a public interface has to say so itself.
#
# It also means these units get no DNS, and they need none: with a proxy
# configured, every client hands the hostname to the proxy in the CONNECT line
# and resolves nothing locally. Resolution happens once, in the one process
# that is allowed to reach a resolver. Anything added here that resolves a name
# itself will fail, and it will fail looking like a network outage.
IPAddressDeny=any
IPAddressAllow=localhost

# Pointed at backend/daemons/egress_proxy.py. Both cases of every variable,
# because the HTTP clients in this codebase disagree about which they read;
# all four (requests, urllib, httpx under the OpenAI client, httplib2 under the
# Google client) were checked end to end through this proxy against a real
# endpoint. The port is site.EGRESS_PROXY_PORT and tests/test_egress.py fails
# if these lines drift from it.
#
# One consequence worth knowing before it is diagnosed as a bug: a redirect from
# an allowlisted host to one that is not is refused, because the client opens a
# second tunnel for the new host and the proxy judges that one on its own. That
# is the intended answer -- the destination is what is being allowed, not the
# request that led there -- but it means a provider that starts redirecting is
# an allowlist entry, not an outage.
#
# NO_PROXY keeps a loopback URL off the proxy, which matters on a dev box where
# LETTERLOCK_COSIGNER_URL points at a local process. In production the
# co-signer is a public host reached through Caddy and goes through the proxy
# like everything else, because it is meant to be a different machine.
Environment=HTTP_PROXY=http://127.0.0.1:8792
Environment=HTTPS_PROXY=http://127.0.0.1:8792
Environment=http_proxy=http://127.0.0.1:8792
Environment=https_proxy=http://127.0.0.1:8792
Environment=NO_PROXY=127.0.0.1,::1,localhost
Environment=no_proxy=127.0.0.1,::1,localhost
