services:
  email:
    # This line is rewritten to a pinned registry digest by
    #   REGISTRY=<repo> deploy/phala/build_and_publish.sh --push
    # It must carry a literal @sha256 digest in production (not a tag): the
    # compose file is measured into the dstack attestation, so a mutable tag or
    # a ${VAR} would let the operator swap the image and break the trust story.
    # The bare tag below is only a pre-publish placeholder.
    image: tee-email-bot:latest
    restart: always
    ports:
      - "8787:8787"
    environment:
      WEBHOOK_HOST: "0.0.0.0"
      WEBHOOK_PORT: "8787"
      WEBHOOK_AUD: "${WEBHOOK_AUD}"
      PUBSUB_SERVICE_ACCOUNT: "${PUBSUB_SERVICE_ACCOUNT}"
    # Secrets (OAuth tokens, LLM key) are injected post-attestation by the dstack
    # KMS, never baked into the measured image. dstack renders encrypted env into
    # the guest; this file is the mount point the app reads.
    env_file:
      - path: /app/.env
        required: false
    volumes:
      - accounts:/app/accounts
      - gmail_tokens:/app/.gmail-mcp
      # dstack guest-agent socket: in-enclave KMS unseal + on-demand attestation.
      - /var/run/dstack.sock:/var/run/dstack.sock

volumes:
  accounts:
  gmail_tokens:
