# Four containers from one image, because one container was one uid.
#
# This file used to run a single service whose entrypoint started the mail
# daemon, the Pub/Sub receiver and the web server as children of one shell. That
# meant one uid (root, since nothing set `user:`) and one process environment
# holding every secret, so a parsing bug in the web server was every mailbox in
# the enclave -- exactly what `deploy/hetzner/*.service.d/` stopped being true on
# the box in commit 01ba733. TDX defends against the host operator; it does
# nothing about a bug in our own code, and the two are different adversaries.
#
# What makes this stronger here than on the box: dstack embeds this file in
# app-compose.json, whose hash is extended as the `compose-hash` launch event
# and measured into RTMR3. So which process runs as which account, and which
# secrets each one is handed, is *attested* rather than merely configured. An
# operator who moves SESSION_SECRET into the mail container changes the
# measurement, and `cosigner/attest.py` stops accepting the client certificate.
# The file modes on the Hetzner box are checkable by nobody but the box.
#
# How the secrets actually arrive, since it decides everything below. dstack
# decrypts `.encrypted-env` to `/dstack/.host-shared/.decrypted-env` on the
# guest filesystem, keeping only names listed in `allowed_envs`;
# `app-compose.service` reads it with `EnvironmentFile=` and `app-compose.sh`
# runs `docker compose up` with no `--env-file` and no passthrough flag. So the
# full set lives in the *compose process* environment, outside every container,
# and a container receives exactly what its own `environment:` block names.
# Interpolation is the partition. Two rules follow:
#
#   * Never bind-mount /dstack/.host-shared into a container. `.decrypted-env`
#     is written with a bare fs::write and no mode, and it is the whole set.
#   * Every name interpolated below must also appear in `allowed_envs` in
#     app-compose.json, or it decrypts to nothing and the service starts
#     unconfigured. That list is set at deploy time by the phala CLI and is not
#     in this repository.
#
# Where the machine may connect to, which the box answers with
# `IPAddressDeny=any` in `deploy/hetzner/hardening.conf` and this file answered
# with nothing at all. The `egress` service is the same CONNECT proxy the box
# runs (`backend/daemons/egress_proxy.py`), the destinations it allows are the
# same `backend/egress.py`, and every role's HTTP clients are pointed at it
# below. Two networks decide who can go around it:
#
#   * `inner` is `internal: true`: docker installs no route off the host for it,
#     so a container attached to it alone reaches the internet through the proxy
#     or not at all. `mail` is that container -- the one holding the Google
#     token, the inference keys and decrypted mail.
#   * `edge` is an ordinary bridge. `egress` is on it because being on it is its
#     job. `web` and `hook` are on it because they must *receive* traffic from
#     outside the CVM: an internal network drops forwarded ingress, so a
#     published port on one never reaches the container.
#
# So for `web` and `hook` the proxy is configuration and not enforcement, and
# saying otherwise would be the kind of claim this file exists to avoid. It
# still buys the dependency-phones-home case and the post-compromise case where
# the attacker uses our own HTTP clients. Closing it for those two means an
# ingress container in front of them holding no data, which is what Caddy is on
# the box; it is not in this repository yet.
#
# NOTE: none of this has been run in a CVM. It is derived from dstack's source
# (dstack-util/src/system_setup.rs, os/common/rootfs/app-compose.{service,sh}),
# and the boot of each role should be watched the first time it deploys.

x-common: &common
  # No shared image: each role runs its own, carrying only its own reachable
  # code (see flake.nix and deploy/phala/image_files.nix). The per-service
  # `image:` lines below are what a role runs, and each is measured into the
  # compose-hash, so the receiver's image cannot silently gain the mail role's
  # custody stack.
  restart: always
  environment: &common-env
    # Fail-closed attestation gate; see backend/tee/tee_boot.py. Also what makes
    # backend/secrets.py read no file at all, which is why no service below
    # mounts one.
    TEE_REQUIRED: "1"
    # Which compose this image is supposed to be running under. Empty is
    # refused: `tee_boot._measurement_gap` used to return silently on an unset
    # value, so the check was on only for whoever remembered to set it. It must
    # be interpolated rather than written here -- the value is the hash of this
    # file, which cannot contain it.
    EXPECTED_COMPOSE_HASH: "${EXPECTED_COMPOSE_HASH:-}"
    # Both cases of every variable, because the HTTP clients in this tree
    # disagree about which they read; the same six lines are in
    # deploy/hetzner/hardening.conf and for the same reason. `egress` is the
    # service name, resolved by docker's embedded DNS on both networks below.
    HTTP_PROXY: "http://egress:8792"
    HTTPS_PROXY: "http://egress:8792"
    http_proxy: "http://egress:8792"
    https_proxy: "http://egress:8792"
    NO_PROXY: "127.0.0.1,::1,localhost"
    no_proxy: "127.0.0.1,::1,localhost"

services:
  # The only role that opens a mailbox. Holds the Google client credentials, the
  # inference keys and the Telegram token, and is the only account that can read
  # database/<id>/token.bin (0600 to this uid, set by backend/paths.py).
  # Applies spooled Polar events, which is why it carries the Polar API token.
  mail:
    <<: *common
    # Each `image:` line is rewritten to a pinned registry digest by
    #   REGISTRY=<repo> deploy/phala/build_and_publish.sh --push
    # It must carry a literal @sha256 digest in production (not a tag): the
    # compose file is measured into the dstack attestation, so a mutable tag or
    # a ${VAR} would let the operator swap the image and break the trust story.
    # The bare tag here is only a pre-publish placeholder.
    image: tee-email-bot-mail:latest
    command: ["mail"]
    user: "10001:10001"
    # The enclave's SupplementaryGroups=, and it has to be spelled out: a
    # numeric `user:` makes the runtime skip the /etc/group lookup that a
    # username would trigger, so the accounts baked into the image would carry
    # no membership at all and database/ at 2770 would be unreadable. 10010 is
    # letterlock-data, 10011 letterlock-wake -- see the `accounts` set in
    # flake.nix, which is where both numbers and the names come from.
    group_add: ["10010", "10011"]
    environment:
      <<: *common-env
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      NEARAI_API_KEY: "${NEARAI_API_KEY:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      GOOGLE_OAUTH_CLIENT_ID: "${GOOGLE_OAUTH_CLIENT_ID:-}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${GOOGLE_OAUTH_CLIENT_SECRET:-}"
      POLAR_API_TOKEN: "${POLAR_API_TOKEN:-}"
      POLAR_ORGANIZATION_ID: "${POLAR_ORGANIZATION_ID:-}"
      POLAR_PRODUCT_ID: "${POLAR_PRODUCT_ID:-}"
      POLAR_SANDBOX: "${POLAR_SANDBOX:-0}"
      # The co-signer holding the outer half of every token's custody. Empty
      # falls back to the default host in backend/site.py. This enclave
      # processes no mail at all while that box is unreachable, by design: see
      # docs/plan_token_custody.md §1 on the availability trade.
      LETTERLOCK_COSIGNER_URL: "${LETTERLOCK_COSIGNER_URL:-}"
    # The only role on the internal network alone, and the only one for which
    # the allowlist below is enforced rather than configured: it publishes no
    # port, so nothing has to reach it from outside and docker can refuse it a
    # route out. Everything it does reach -- Google, the inference provider,
    # Telegram, Polar, the co-signer -- goes through `egress`.
    networks:
      - inner
    volumes:
      - database:/app/database
      - state:/app/state
      # dstack guest-agent socket: in-enclave KMS unseal + on-demand attestation.
      - /var/run/dstack.sock:/var/run/dstack.sock
      # RA-TLS material + boot attestation record written by tee_boot; tmpfs so
      # the enclave-held private key never lands on the encrypted volume at
      # rest. Per container, not shared: each role derives its own client
      # certificate from GetTlsKey, so no private key crosses a container
      # boundary. Mode 0777 because the tmpfs is created by the runtime as root
      # and the container's single process is not; the private keys are created
      # at 0600 by paths.write_private (never written and then narrowed, which
      # on a 0777 directory is a world-readable key for two syscalls), and
      # nothing else runs in here to read them.
      - type: tmpfs
        target: /app/attestation
        tmpfs:
          mode: 0777

  # The product UI. Holds a data key for rendering an account's own documents
  # and so runs the attestation gate, but never a Google token: token.bin is
  # 0600 to the mail uid, and the consent URL, the OAuth callback and voice
  # generation cross to the mail role over backend/custody/handoff.py.
  #
  # It carries no inference key. Which providers Settings offers is decided by
  # whether their keys are present, and this process used to hold two live keys
  # for no other purpose than answering that. It now asks the mail role over
  # handoff.OP_PROVIDERS, which sends names and never a key. The cost is that
  # /settings returns 503 while the mail role is down rather than rendering as
  # though one provider were configured.
  web:
    <<: *common
    image: tee-email-bot-web:latest
    command: ["web"]
    user: "10002:10002"
    # letterlock-data only. Not letterlock-wake: writing the wake spool starts a
    # drafting pass against an account of the writer's choosing and spends that
    # account's co-signer budget, which is the same reason the web uid is kept
    # out of it on the box.
    group_add: ["10010"]
    environment:
      <<: *common-env
      SESSION_SECRET: "${SESSION_SECRET:-}"
      SESSION_SECRET_PREVIOUS: "${SESSION_SECRET_PREVIOUS:-}"
      POLAR_API_TOKEN: "${POLAR_API_TOKEN:-}"
      POLAR_ORGANIZATION_ID: "${POLAR_ORGANIZATION_ID:-}"
      POLAR_PRODUCT_ID: "${POLAR_PRODUCT_ID:-}"
      POLAR_CHECKOUT_URL: "${POLAR_CHECKOUT_URL:-}"
      POLAR_SANDBOX: "${POLAR_SANDBOX:-0}"
      LETTERLOCK_COSIGNER_URL: "${LETTERLOCK_COSIGNER_URL:-}"
      # The one interface the product is served on. It binds loopback by
      # default (`site.LOOPBACK`), which on the box is right -- Caddy is in
      # front of it there -- and in here meant the published port below reached
      # a socket listening on the container's own loopback and the UI answered
      # nobody.
      WEB_HOST: "0.0.0.0"
      # Which peer's X-Forwarded-For `web_server._source_ip` may believe.
      # Loopback is always trusted; this names whatever dstack's ingress
      # connects from, and until somebody has watched a real CVM and can say
      # what that address is, it stays empty. Empty costs a wrong audit row
      # (every sign-in recorded as coming from the ingress); a guess costs a
      # forgeable one, which is worse. Naming it here also means adding the
      # variable to `allowed_envs` in app-compose.json.
      LETTERLOCK_TRUSTED_PROXIES: "${WEB_TRUSTED_PROXIES:-}"
    # Both networks. `edge` because a published port on an internal-only
    # network never receives forwarded ingress, and this is the product's UI;
    # `inner` so it reaches `egress` the same way the mail role does. Being on
    # `edge` is what makes the proxy configuration rather than enforcement for
    # this role -- see the header.
    networks:
      - inner
      - edge
    ports:
      - "8790:8790"
    volumes:
      - database:/app/database
      - state:/app/state
      - /var/run/dstack.sock:/var/run/dstack.sock
      - type: tmpfs
        target: /app/attestation
        tmpfs:
          mode: 0777

  # Verifies the Pub/Sub OIDC JWT and appends an address to the wake spool. The
  # cheapest role to isolate and the most exposed: it is the process Google
  # posts to, and it needs nothing.
  #
  # No database volume, so it cannot read the account list -- it does not
  # resolve the address it receives, the mail role does. No guest-agent socket,
  # which is why it runs no attestation gate: it holds no key to unseal and no
  # certificate to obtain, and the address it spools is acted on by a role that
  # is gated. Withholding the socket is the whole point, since that socket is
  # unauthenticated and GetKey takes a caller-supplied derivation path, so any
  # process that can open it can derive this app's sealing key.
  hook:
    <<: *common
    image: tee-email-bot-hook:latest
    command: ["hook"]
    user: "10003:10003"
    # letterlock-wake alone: the FIFO and the wake spool, and nothing else in
    # state/. Deliberately not letterlock-data, which is what keeps the account
    # list out of reach of the process Google posts to.
    group_add: ["10011"]
    ports:
      - "8787:8787"
    environment:
      <<: *common-env
      WEBHOOK_HOST: "0.0.0.0"
      WEBHOOK_PORT: "8787"
      WEBHOOK_AUD: "${WEBHOOK_AUD}"
      PUBSUB_SERVICE_ACCOUNT: "${PUBSUB_SERVICE_ACCOUNT}"
    # `edge` for the same reason as `web`: Google posts to it. It reaches the
    # network for one thing only, verifying the Pub/Sub token's signature, and
    # that goes through the proxy like everything else.
    networks:
      - inner
      - edge
    volumes:
      - state:/app/state

  # The only container allowed to open a connection to the internet, and the
  # same code the box runs as `egress-proxy.service`. An HTTP CONNECT proxy on
  # 8792: it reads one request line, checks the hostname against
  # `backend/egress.py`, and moves opaque bytes. TLS is end to end between the
  # role and the destination, so this process holds no decrypted byte and no key
  # that would let it.
  #
  # It is the cheapest role to isolate after `hook` and it needs even less: no
  # volume, no guest-agent socket, no secret, and therefore no attestation gate
  # (it has nothing to unseal). What it does need is the one thing no other role
  # has, which is why it is a container of its own rather than a thread in the
  # mail daemon: on the box the process holding the network is deliberately not
  # the process holding the API keys.
  #
  # It publishes no port. The only things that can reach 8792 are containers on
  # these two networks, which is every role and nothing else. It does not
  # authenticate its callers -- the boundary is over destinations, not callers,
  # and `inner` is what stops a role going around it.
  egress:
    <<: *common
    image: tee-email-bot-egress:latest
    command: ["egress"]
    user: "10004:10004"
    environment:
      # Deliberately not *common-env: this container must not be pointed at
      # itself, and it needs none of the rest. TEE_REQUIRED is here so
      # backend/secrets.py reads no file, the same as everywhere else.
      TEE_REQUIRED: "1"
      # Its clients are other containers, so loopback would answer none of them.
      EGRESS_PROXY_BIND: "0.0.0.0"
    networks:
      - inner
      - edge

volumes:
  database:
  state:

networks:
  # No route off the host. A container attached to this alone reaches the
  # internet through `egress` or not at all.
  inner:
    internal: true
  # An ordinary bridge, for the containers that must receive traffic from
  # outside the CVM and for the one that must leave it.
  edge:
