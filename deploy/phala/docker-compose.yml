services:
  email:
    # This line is rewritten to a pinned registry digest by
    #   REGISTRY=<repo> deploy/phala/build_and_publish.sh --push
    # It must carry a literal @sha256 digest in production (not a tag): the
    # compose file is measured into the dstack attestation, so a mutable tag or
    # a ${VAR} would let the operator swap the image and break the trust story.
    # The bare tag below is only a pre-publish placeholder.
    image: tee-email-bot:latest
    restart: always
    ports:
      - "8787:8787"
    environment:
      WEBHOOK_HOST: "0.0.0.0"
      WEBHOOK_PORT: "8787"
      WEBHOOK_AUD: "${WEBHOOK_AUD}"
      PUBSUB_SERVICE_ACCOUNT: "${PUBSUB_SERVICE_ACCOUNT}"
      # Track F3: make the attest-before-run gate fail closed. tee_boot aborts
      # unless the CVM is attested and the KMS released keys + secrets.
      TEE_REQUIRED: "1"
      # Optional belt-and-suspenders: the compose_hash the guest agent must
      # report. The KMS is the real enforcer; this catches config drift early.
      EXPECTED_COMPOSE_HASH: "${EXPECTED_COMPOSE_HASH:-}"
      # The co-signer holding the outer half of every token's custody. Empty
      # falls back to the default host in backend/site.py. This enclave
      # processes no mail at all while that box is unreachable, by design: see
      # docs/plan_token_custody.md §1 on the availability trade.
      LETTERLOCK_COSIGNER_URL: "${LETTERLOCK_COSIGNER_URL:-}"
    # Secrets (the LLM keys, the Telegram creds, the Polar keys, SESSION_SECRET
    # and the Google OAuth client) are injected post-attestation via dstack
    # encrypted environment variables:
    # encrypted to the app KMS key, decrypted only inside the attested CVM, never
    # baked into the measured image. Encrypt them with the phala CLI at deploy
    # time; the guest sees them as env once the measurement is authorized.
    #
    # There is deliberately no `env_file: /app/.env` here. It was mounted with
    # `required: false`, which made a cleartext secrets file on the volume a
    # supported fallback -- a copy the KMS does not gate and the attestation does
    # not cover. tee_boot now fails closed if that file exists at all, so adding
    # the mount back stops the enclave from booting rather than silently
    # weakening it. backend/secrets.py is the matching rule on the app side: it
    # reads no file under TEE_REQUIRED.
    #
    # GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET are injected the same
    # way, and there is deliberately no `/app/.gmail-mcp` volume any more: that
    # mount existed to carry gcp-oauth.keys.json, the widest-blast-radius value
    # here and the last one read off disk. oauth_app.load_keys() refuses the file
    # under TEE_REQUIRED and the boot gate refuses to start with one present, so
    # re-adding the volume stops the enclave booting rather than quietly putting
    # the client secret back outside the KMS.
    volumes:
      - database:/app/database
      # RA-TLS material + boot attestation record written by tee_boot; tmpfs so
      # the enclave-held private key never lands on the encrypted volume at rest.
      - type: tmpfs
        target: /app/attestation
      # dstack guest-agent socket: in-enclave KMS unseal + on-demand attestation.
      - /var/run/dstack.sock:/var/run/dstack.sock

volumes:
  database:
