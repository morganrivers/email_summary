[flake8]
max-line-length = 100
extend-exclude = venv,.git,__pycache__,deploy/phala,database,state,docs
# E203/W503 disagree with how slices and binary operators are wrapped here and
# both are on pycodestyle's own list of checks that contradict PEP 8.
extend-ignore = E203,W503
# E402 is "import not at top of file", and these four files import after code
# on purpose: each one must set sys.path or load environment before the first
# backend import, which is the thing E402 exists to catch everywhere else.
per-file-ignores =
    tests/conftest.py:E402
    backend/masking/masking_eval/run.py:E402
    tools/manual/fallback.py:E402
    tools/manual/smoke_agentic.py:E402

[isort]
line_length = 100
known_first_party = backend,frontend,cosigner,deploy,tools
skip_glob = venv/*,deploy/phala/*
